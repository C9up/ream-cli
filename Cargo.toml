[package]
name = "ream-cli"
version = "0.3.23"
edition = "2021"
license = "MIT"
description = "Ream CLI — Rust-native command-line tool for the Ream framework"
repository = "https://github.com/C9up/ream-cli"

[[bin]]
name = "ream"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# Signs over-the-air updates (`ream android:publish`); the key is a 32-byte seed,
# wiped from memory when the signing key drops (`zeroize`).
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
