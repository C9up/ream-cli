# One workflow, like every other package in the cohort.
#
# It used to be two — `ream-cli-ci.yml` for fmt/clippy/tests on every push, and
# `publish.yml` for the release — and two buttons named alike is how a test run
# gets launched three times in place of a publish. The split existed because the
# test gate had lived INSIDE the publish workflow, so a commit was only verified
# when someone released; that reason survives here, as the `check` job below,
# which still runs on every push.
#
# The publish jobs are gated on `workflow_dispatch` and wait for every
# verification job (`scripts/check-publish-gates.mjs` at the monorepo root
# checks both), and the concurrency group
# carries `github.event_name` so a push can never cancel a release in flight.

name: ream-cli-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Type YES to publish a version LOWER than the one on npm (a backport to an older line). It goes out under the backport dist-tag, so latest does not move. A version npm already holds can never be published again: bump it instead.'
        required: false
        default: 'no'

permissions:
  contents: read

concurrency:
  # Differentiated by event_name so a workflow_dispatch publish run is not
  # cancelled by a subsequent push to main mid-flight. And a dispatch never
  # cancels another one: a second "Run workflow" on the same ref used to stop
  # the first wherever it was, between `npm publish` and the release included,
  # leaving a version on npm that no rerun could finish (the drift gate then
  # refuses it as already published). Dispatch runs queue; pushes and pull
  # requests still supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `node` is not a convenience here: the integration tests spawn it to
      # exercise the configure probe and the key generator.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: cargo fmt --check
      # --locked everywhere: a Cargo.toml edit that drifts from Cargo.lock fails
      # here instead of being re-resolved on the runner, so what is tested and
      # published is the dependency set the repository records.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p ream-cli
      # `ream new` end to end: scaffold, install from the registry, run the
      # project's own suites. pnpm 11+ because that is the line that refuses an
      # unapproved build script — the failure this test exists to catch.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 12 }
      - run: cargo test --locked -p ream-cli --test new_test -- --ignored
      - run: cargo build --locked --release -p ream-cli

  # win32-x64 is a published target, and the package managers there are `.cmd`
  # shims that Rust's `Command` does not find on its own. Scoped to the program
  # resolution and to `ream new` starting pnpm through it.
  check-windows:
    name: Windows program resolution
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: 'cargo test --locked -p ream-cli --bin ream tools::'
      - run: cargo test --locked -p ream-cli --test new_test

  gates:
    name: Publish gates (tag + drift)
    # Releases are manual. `build` and `publish` need this job, so they skip
    # with it on an ordinary push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # `latest`, or `backport` for a version lower than the registry's.
      dist_tag: ${{ steps.drift.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Tag-vs-Cargo.toml gate
        id: tag
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "::error::HEAD has no v<MAJOR>.<MINOR>.<PATCH>-shaped tag — refuse to publish from an untagged commit"
            exit 1
          fi
          cargo_v=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)
          if [ -z "$cargo_v" ]; then
            echo "::error::Could not parse [package].version from Cargo.toml"
            exit 1
          fi
          cargo_tag="v${cargo_v}"
          if [ "$tag" != "$cargo_tag" ]; then
            echo "::error::Tag $tag does not match Cargo.toml $cargo_tag — refuse to publish from a drifted tag"
            exit 1
          fi
          # The tagged commit is the one `main` holds: a dispatch from another
          # branch, or a tag on a commit main never received, would publish
          # code the push CI on main has not seen.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::HEAD $(git rev-parse --short HEAD) ($tag) is not on origin/main — refuse to publish a commit main does not hold"
            exit 1
          fi
          echo "Tag gate passed: $tag == $cargo_tag, on origin/main"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Drift fail-closed gate
        id: drift
        env:
          CONFIRM_OVERWRITE: ${{ inputs.confirm_overwrite }}
        run: |
          local_v=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)
          if [ -z "$local_v" ]; then
            echo "::error::Could not parse [package].version from Cargo.toml"
            exit 1
          fi
          npm_err=$(mktemp)
          # `if` form so `set -e` (bash -e) does not abort the step when
          # `npm view` exits non-zero (e.g. E404 on a first publish) — a bare
          # assignment would die before `status=$?` and skip the E404 path.
          if npm_v=$(npm view --fetch-timeout=30000 @c9up/ream-cli version 2>"$npm_err"); then
            status=0
          else
            status=$?
          fi
          err=$(cat "$npm_err"); rm -f "$npm_err"
          if [ "$status" -ne 0 ]; then
            if echo "$err" | grep -qE 'E404|404 Not Found'; then
              npm_v=""
              echo "Drift gate: package not yet on registry — first-publish path"
            else
              echo "::error::Cannot reach npm registry — refuse to publish without a verified registry version. Output: $err"
              exit 1
            fi
          fi
          if [ -z "$npm_v" ]; then
            echo "Drift gate passed: first publish of @c9up/ream-cli (local $local_v)"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          highest=$(printf '%s\n%s\n' "$npm_v" "$local_v" | sort -V | tail -1)
          if [ "$local_v" = "$npm_v" ]; then
            # npm refuses a version it already holds (and one unpublished less than
            # 24 h ago), whatever this gate says, so no input can make this path
            # publish: it used to be let through on confirm_overwrite=YES and failed
            # one step later with E403.
            echo "::error::Local version $local_v is already on npm, which never accepts a version twice — bump Cargo.toml"
            exit 1
          elif [ "$highest" = "$npm_v" ]; then
            if [ "$CONFIRM_OVERWRITE" != "YES" ]; then
              echo "::error::Registry version $npm_v is newer than local $local_v — refuse to publish an older version without confirm_overwrite=YES"
              exit 1
            fi
            # An older number published as `latest` would move every fresh install
            # back to it; a backport goes out under its own dist-tag instead.
            echo "Override accepted: publishing $local_v under the 'backport' dist-tag; latest stays $npm_v"
            echo "dist_tag=backport" >> "$GITHUB_OUTPUT"
          else
            echo "Drift gate passed: local $local_v > registry $npm_v"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # fmt / clippy / tests are not repeated here: `check` and `check-windows`
      # run on the dispatch too, and `publish` waits for both.

      # `ream new` writes a caret per package, and on 0.x a caret is a ceiling:
      # a pin left behind scaffolds apps against the line before the one being
      # maintained. `cargo test` cannot see that — it needs the registry — so
      # the publish is where it is checked.
      - name: Scaffold pins still reach what is published
        run: ./scripts/check-scaffold-pins.sh

  build:
    name: Build (${{ matrix.target }})
    needs: [gates]
    # Stated, not only inherited from `gates`: an `if: always()` added here
    # later must not turn a push into a build feeding a publish.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ream
            npm-pkg: ream-cli-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: ream
            npm-pkg: ream-cli-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ream
            npm-pkg: ream-cli-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ream
            npm-pkg: ream-cli-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ream.exe
            npm-pkg: ream-cli-win32-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release --target ${{ matrix.target }} -p ream-cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.npm-pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  # RustSec advisories against Cargo.lock, on every push and before every
  # publish. A lockfile nothing re-audits goes red silently: seven of them
  # had, on the hashing, TLS and sanitising paths, before this job existed.
  # Vulnerabilities and yanked crates fail it; unmaintained and unsound
  # notices are printed.
  audit:
    name: Advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Pinned and --locked: the auditor is itself a dependency of the release.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny yanked

  publish:
    # Every job that verifies something, not only the ones on the build path:
    # `check` carries the end-to-end `ream new` and `check-windows` the only
    # verification of the win32-x64 package that goes out with the others.
    # Leaving one out ran it side by side with the publish, which shipped
    # whatever it found.
    needs: [build, gates, check, check-windows, audit]
    if: github.event_name == 'workflow_dispatch'
    # A publish is a deployment to npm. The environment's protection rules
    # (required reviewer, deployments from v* tags only) are what stands
    # between one write-access account and a release, and npm trusted
    # publishing is bound to this name.
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # write, not read: the release step needs to create one.
      contents: write
      # The OIDC token npm signs the provenance with.
      id-token: write
    steps:
      - name: Verify NPM_TOKEN secret
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret missing — set in repo settings before manual publish"
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The release notes are a commit range between two tags; a shallow
          # clone has neither.
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Create platform-specific packages.
      #
      # Every package.json written here carries `publishConfig.provenance`, so
      # each version is signed with the run that built it, and the same files
      # published from anywhere but this workflow fail instead of going out
      # unsigned: npm has no provenance provider outside CI. `repository` is
      # what npm matches the signature against.
      - name: Package binaries
        env:
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::TAG output from gates job is empty — refusing to publish with VERSION=\"\""
            exit 1
          fi
          VERSION=${TAG#v}
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            PKG="ream-cli-${platform}"
            mkdir -p "npm/${PKG}"

            if [ "$platform" = "win32-x64" ]; then
              BINARY="ream.exe"
            else
              BINARY="ream"
            fi

            cp "artifacts/${PKG}/${BINARY}" "npm/${PKG}/"
            chmod +x "npm/${PKG}/${BINARY}" 2>/dev/null || true

            cat > "npm/${PKG}/package.json" << PKGEOF
          {
            "name": "@c9up/${PKG}",
            "version": "${VERSION}",
            "os": ["${platform%%-*}"],
            "cpu": ["${platform##*-}"],
            "bin": { "ream": "./${BINARY}" },
            "repository": { "type": "git", "url": "git+https://github.com/C9up/ream-cli.git" },
            "publishConfig": { "access": "public", "provenance": true }
          }
          PKGEOF

            cp README.md "npm/${PKG}/README.md"
          done

      # The wrapper, pinning the five platform packages at the exact version.
      - name: Package @c9up/ream-cli
        env:
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::TAG output from gates job is empty — refusing to publish with VERSION=\"\""
            exit 1
          fi
          VERSION=${TAG#v}
          mkdir -p npm/ream-cli
          cat > npm/ream-cli/package.json << PKGEOF
          {
            "name": "@c9up/ream-cli",
            "version": "${VERSION}",
            "description": "Ream CLI — Rust-native command-line tool",
            "bin": { "ream": "bin/ream" },
            "repository": { "type": "git", "url": "git+https://github.com/C9up/ream-cli.git" },
            "publishConfig": { "access": "public", "provenance": true },
            "optionalDependencies": {
              "@c9up/ream-cli-linux-x64": "${VERSION}",
              "@c9up/ream-cli-linux-arm64": "${VERSION}",
              "@c9up/ream-cli-darwin-x64": "${VERSION}",
              "@c9up/ream-cli-darwin-arm64": "${VERSION}",
              "@c9up/ream-cli-win32-x64": "${VERSION}"
            }
          }
          PKGEOF

          mkdir -p npm/ream-cli/bin
          cat > npm/ream-cli/bin/ream << 'BINEOF'
          #!/usr/bin/env node
          // Spawned rather than run synchronously, so that signals reach the binary. In a
          // container this script is PID 1 and `docker stop` sends SIGTERM here: blocked
          // in execFileSync it passed nothing on, the server never shut down, and the
          // stop ended in SIGKILL.
          const { spawn } = require('child_process');
          const path = require('path');
          const os = require('os');
          const platformMap = {
            'linux-x64': '@c9up/ream-cli-linux-x64',
            'linux-arm64': '@c9up/ream-cli-linux-arm64',
            'darwin-x64': '@c9up/ream-cli-darwin-x64',
            'darwin-arm64': '@c9up/ream-cli-darwin-arm64',
            'win32-x64': '@c9up/ream-cli-win32-x64',
          };
          const pkg = platformMap[`${os.platform()}-${os.arch()}`];
          if (!pkg) { console.error(`Unsupported platform: ${os.platform()}-${os.arch()}`); process.exit(1); }
          const bin = os.platform() === 'win32' ? 'ream.exe' : 'ream';
          const binPath = path.join(require.resolve(`${pkg}/package.json`), '..', bin);
          const child = spawn(binPath, process.argv.slice(2), { stdio: 'inherit' });
          // Ctrl-C reaches the whole process group, the binary included: passing SIGINT
          // on would deliver it twice. Listening keeps this script alive until the
          // binary has finished stopping.
          process.on('SIGINT', () => {});
          for (const signal of ['SIGTERM', 'SIGHUP']) {
            process.on(signal, () => child.kill(signal));
          }
          child.on('error', (e) => { console.error(e.message); process.exit(1); });
          child.on('exit', (code, signal) => {
            process.exit(signal ? 128 + os.constants.signals[signal] : code);
          });
          BINEOF
          chmod +x npm/ream-cli/bin/ream
          cp README.md npm/ream-cli/README.md

      # npm has no multi-package transaction and a published version cannot be
      # taken back, so whatever can be refused is made to be refused before the
      # first real publish: all six packages are packed and checked first, and
      # one that fails leaves the registry untouched instead of holding a
      # version with some platforms missing.
      - name: Dry-run every package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in npm/ream-cli-linux-x64 npm/ream-cli-linux-arm64 npm/ream-cli-darwin-x64 npm/ream-cli-darwin-arm64 npm/ream-cli-win32-x64 npm/ream-cli; do
            (cd "$dir" && npm publish --dry-run)
          done

      # The platform packages first and the wrapper last: until the wrapper is
      # out, nothing installs the new version, so a failure in between strands
      # no user on a wrapper whose binaries are missing.
      # Under the drift gate's dist-tag: a backport must not move `latest`.
      # --provenance signs each tarball with this run's OIDC identity, as every
      # other package's publish does, so all six trace back to this workflow.
      - name: Publish the six packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.gates.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "$DIST_TAG" ]; then
            echo "::error::the drift gate produced no dist-tag — refuse to publish"
            exit 1
          fi
          for dir in npm/ream-cli-linux-x64 npm/ream-cli-linux-arm64 npm/ream-cli-darwin-x64 npm/ream-cli-darwin-arm64 npm/ream-cli-win32-x64 npm/ream-cli; do
            (cd "$dir" && npm publish --provenance --tag "$DIST_TAG")
          done
      - name: Create the GitHub release
        # Notes from the commits this tag contains. Without it a published
        # version arrives with no explanation of what changed, and the only way
        # to find out is to read a diff.
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag the gates job read off HEAD. `GITHUB_REF_NAME` was the
          # branch on a workflow_dispatch — the usual way this runs — so the
          # `refs/tags/main` lookup below failed and the step exited 0 having
          # created nothing. Every published version arrived with no notes.
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if [ -z "$tag" ]; then
            echo "::error::TAG output from gates job is empty — cannot create a release"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} is not in this checkout - refusing to guess the notes range"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists - leaving it alone"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${tag}"
          [ -n "$prev" ] && range="${prev}..${tag}"
          notes="$(git log "$range" --no-merges --format='### %s%n%n%b%n' \
            | grep -vE '^### [a-z0-9@/.-]+ [0-9]+\.[0-9]+\.[0-9]+$' || true)"
          [ -z "${notes// }" ] && notes="_Version bump only - no behavioural change._"
          [ -n "$prev" ] && notes="${notes}"$'\n\n---\n\n'"Changes since \`${prev}\`."
          printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
