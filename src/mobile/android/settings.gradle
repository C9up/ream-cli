// Generated by `ream android:*` from reamrc.ts: edit the config, not this file.
pluginManagement { includeBuild("{{nodeModules}}/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  // Run from .ream, where react-native.config.js points at this project and
  // package.json lists the app's dependencies (resolved from the app's
  // node_modules above it).
  ex.autolinkLibrariesFromCommand(
    ["node", "{{nodeModules}}/@react-native-community/cli/build/bin.js", "config"],
    new File("{{reamDir}}"),
    // What invalidates its cached output: the app's dependencies, and the
    // generated config (the app's id).
    settings.layout.rootDirectory.dir("../..").files(
      "package.json", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", ".ream/react-native.config.js",
    ),
  )
}
rootProject.name = "{{gradleName}}"
include ":app"
includeBuild("{{nodeModules}}/@react-native/gradle-plugin")
