// Generated by `ream android:*` from reamrc.ts: edit the config, not this file.
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("{{projectRoot}}")
    reactNativeDir = file("{{nodeModules}}/react-native")
    codegenDir = file("{{nodeModules}}/@react-native/codegen")
    cliFile = file("{{nodeModules}}/react-native/cli.js")
    entryFile = file("{{entry}}")
    bundleConfig = file("{{metroConfig}}")
    autolinkLibrariesWithApp()
}

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    // The native packages' platform code (their `reamNative.android.java`).
    sourceSets.main.java.srcDirs += [{{javaDirs}}]

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "{{id}}"
    defaultConfig {
        applicationId "{{id}}"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode {{build}}
        versionName "{{version}}"
        externalNativeBuild {
            cmake {
                // The Rust libraries `ream` cross-compiled, one folder per ABI.
                arguments "-DREAM_RUST_DIR={{rustDir}}"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
{{releaseSigning}}    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
{{releaseSigningUse}}            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
